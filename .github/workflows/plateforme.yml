name: Plateforme (Next.js + PostgreSQL)

on:
  push:
    paths: ["plateforme/**", ".github/workflows/plateforme.yml"]
  pull_request:
    paths: ["plateforme/**", ".github/workflows/plateforme.yml"]

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plateforme
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      # base utilisée par la compilation (pages pré-générées : coachs, tarifs)
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plateforme/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/migrate.mjs --seed
      - run: npm run build
