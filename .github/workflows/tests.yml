name: Tests

on:
  push:
  pull_request:

# Les deux projets sont indépendants : deux jobs, pour qu'un échec dise
# tout de suite lequel des deux est cassé.
jobs:
  cafe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s cafe/tests -v

  trading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s trading/tests -v
