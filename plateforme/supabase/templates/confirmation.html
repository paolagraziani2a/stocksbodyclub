<div style="background:#f0eadb;padding:40px 16px;font-family:Helvetica,Arial,sans-serif;color:#131512">
  <div style="max-width:480px;margin:0 auto;background:#faf6eb;padding:40px 32px;border-radius:16px">
    <p style="font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#4f544d;margin:0">The Body Club</p>
    <h1 style="font-size:28px;text-transform:uppercase;margin:16px 0 24px">Bienvenue</h1>
    <p style="line-height:1.6">Merci pour votre inscription. Cliquez sur le bouton ci-dessous pour activer votre compte et réserver votre premier cours.</p>
    <p style="margin:32px 0">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/compte"
         style="background:#131512;color:#f0eadb;padding:14px 28px;border-radius:999px;text-decoration:none;display:inline-block">
        Activer mon compte
      </a>
    </p>
    <p style="font-size:13px;color:#4f544d;line-height:1.6">Si vous n'avez pas créé de compte, ignorez simplement cet email.</p>
  </div>
</div>
